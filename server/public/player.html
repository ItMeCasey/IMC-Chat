<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMC-Chat player</title>
<link rel="stylesheet" href="/fonts/fonts.css"><script src="/theme.js"></script>
<style>
  :root { --bg:#222A2A; --panel:#1A2020; --text:#E2DAC2; --muted:#9aa39f; --accent:#4FBBBC; --accent2:#F39120; --danger:#EC4624; --on:#1A2020; --font:"IMC Sans","Segoe UI",sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: var(--font); user-select: none; }
  body { display: flex; flex-direction: column; }
  /* the title strip: the window's own, in the chat's theme (the window buttons at the right are coloured to match) */
  header { flex: none; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; padding-right: calc(100vw - env(titlebar-area-width, calc(100vw - 138px))); background: var(--panel); position: relative; -webkit-app-region: drag; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg,var(--accent) 0 30%,var(--accent2) 30% 55%,var(--danger) 55% 75%,var(--accent2) 75% 90%,var(--text) 90%); }
  body.full header { display: none; }
  #ch { font-family: "IMC Sans", sans-serif; font-weight: 400; letter-spacing: 3px; white-space: nowrap; } #info { color: var(--muted); font-size: .8em; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* shown only while the video is not: starting up, offline, or ended. The video and the controls are windows of their own above this one. */
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; letter-spacing: 2px; color: var(--muted); background: var(--bg); }
  #stage b { display: block; color: var(--text); font-size: 1.3em; margin-bottom: 10px; letter-spacing: 4px; }
  button { font: inherit; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; height: 38px; padding: 0 16px; border: 0; cursor: pointer; background: var(--accent2); color: var(--on); margin-top: 16px; }
</style></head>
<body>
<header><span id="ch"></span><span id="info"></span></header>
<div id="stage"><div><b id="t">STARTING</b><span id="m">Opening the stream...</span><br><button id="retry" style="display:none">Try again</button></div></div>
<script>
const $ = (id) => document.getElementById(id), P = window.imcPlayer, ch = new URLSearchParams(location.search).get('channel') || '';
$('ch').textContent = '#' + ch;
$('retry').onclick = () => P && P.cmd({ a: 'retry' });
document.addEventListener('keydown', (e) => { if (!P) return; if (e.code === 'Space') { e.preventDefault(); P.cmd({ a: 'pause' }); } else if (e.key.toLowerCase() === 'f') P.cmd({ a: 'full' }); else if (e.key === 'Escape') P.cmd({ a: 'full', off: true }); });
// the window's buttons take the theme's colours
watchTheme((t) => { if (P && P.theme) P.theme({ color: t.v[1], symbolColor: t.v[3] }); });
if (P) P.on((d) => {
  if (d.type !== 'state') return; document.body.classList.toggle('full', !!d.full);
  adLeft = d.ad || 0; if (adLeft) $('info').innerHTML = '<b style="color:var(--accent2);letter-spacing:2px">AD BREAK</b> &middot; ' + (d.adMuted ? 'the ad is playing muted, about ' + adLeft + ' s left' : 'Twitch is showing ads; the picture is paused and comes back in about ' + adLeft + ' s'); else if (wasAd) live(); wasAd = !!adLeft;
  $('t').textContent = d.ended ? d.ended.toUpperCase() : 'STARTING'; $('m').textContent = d.ended ? '' : 'Opening the stream...'; $('retry').style.display = d.ended ? '' : 'none';
});
// who is live, from the chat window's data
let adLeft = 0, wasAd = false;
const live = () => adLeft ? null : fetch('/api/status').then((r) => r.json()).then((s) => { const c = s.channels.find((x) => x.login === ch); $('info').textContent = c ? (c.live ? 'LIVE · ' + c.live.viewers.toLocaleString() + ' viewers' + (c.live.game ? ' · ' + c.live.game : '') + (c.live.title ? ' · ' + c.live.title : '') : 'offline') : ''; }).catch(() => {}); live(); setInterval(live, 60000);
</script></body></html>
